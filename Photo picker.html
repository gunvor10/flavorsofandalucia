<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Photo picker</title>
<style>
body{margin:0;background:#FAF8F4;color:#211E1A;font-family:'Public Sans',system-ui,sans-serif;padding:40px}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px}
p.sub{margin:0 0 32px;color:#655D52;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
figure{margin:0}
img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:6px;background:#E4DDD1}
figcaption{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8A8275}
b{display:block;font-size:15px;letter-spacing:0;text-transform:none;color:#211E1A;font-weight:500;margin-bottom:4px}
</style></head>
<body>
<h1>Which photos should we use?</h1>
<p class="sub">All six are from sevillapanorsk.com. Tell me the letters and I will place them.</p>
<div class="grid">
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-spaniaopplevelser.png" alt="A"><figcaption><b>A</b>gunvor-spaniaopplevelser</figcaption></figure>
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-alcazares-sevilla.png" alt="B"><figcaption><b>B</b>gunvor-alcazares-sevilla</figcaption></figure>
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-foran-macarena-kirken-sevilla.jpg" alt="C"><figcaption><b>C</b>gunvor-foran-macarena-kirken</figcaption></figure>
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-foran-giralda-tarnet-sevilla-2.jpg" alt="D"><figcaption><b>D</b>gunvor-foran-giralda-tarnet-2</figcaption></figure>
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-guiding-sevilla-2.jpg" alt="E"><figcaption><b>E</b>gunvor-guiding-sevilla-2</figcaption></figure>
<figure><img src="https://sevillapanorsk.com/uploads/gunvor-fottur-andalucia.jpg" alt="F"><figcaption><b>F</b>gunvor-fottur-andalucia</figcaption></figure>
</div>
</body></html>
