name: SEO check

# Runs on every push. If it fails, GitHub emails the person who pushed
# (default GitHub notification: "Actions → Notify on failed workflows").
on: [push, workflow_dispatch]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check head tags, schema, placeholders and sitemap
        run: python3 tools/seo_check.py
